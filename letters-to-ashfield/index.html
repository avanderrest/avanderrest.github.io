<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letters to Ashfield</title>
  <meta name="description"
    content="Letters to Ashfield — a new postmistress in a damp 1950 village sorts the morning post, tidies other people’s shelves, and knits the evidence together to prove the last one did not slip." />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B6%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <a class="home" href="../index.html" aria-label="Back to the wall">&larr;</a>
    <h1>Letters to Ashfield</h1>
    <div class="daybox" id="daybox"></div>
    <div class="spacer"></div>
    <button type="button" class="tiny" id="btn-ledger">Ledger</button>
    <button type="button" class="tiny" id="btn-case">Case box</button>
    <button type="button" class="tiny" id="btn-map">Map</button>
    <button type="button" class="tiny" id="btn-sound" aria-pressed="true">Sound</button>
    <button type="button" class="tiny" id="btn-how">How to play</button>
    <button type="button" class="tiny" id="btn-restart" title="Start again from the very beginning">Restart</button>
  </header>

  <main id="desk-view">
    <!-- One track, two views: the counter above, the desk below. The morning starts on the
         desk; when the pile is sorted the view lifts up to the counter. -->
    <div class="track" id="track">
      <section class="view counterview" id="counterview" aria-label="The counter">
        <section class="counter" id="counter">
          <div class="backwall">
            <div class="window" aria-hidden="true"><div class="rainfall"></div></div>
            <svg class="shelves" id="shelves" viewBox="0 0 600 200" preserveAspectRatio="xMaxYMax meet" aria-hidden="true"></svg>
          </div>
          <div class="visitor" id="visitor"></div>
          <div class="bubble" id="bubble" hidden></div>
          <div class="countertop" aria-hidden="true"></div>
        </section>
        <section class="desk counterdesk">
          <div class="mat cmat" id="cmat"></div>
          <div class="kit" id="kit"></div>
        </section>
      </section>
      <section class="view sortview" id="sortview" aria-label="The desk">
        <div class="pilecol">
          <div class="mat" id="mat" aria-label="The pile"></div>
          <div class="directory" id="directory"></div>
        </div>
        <div class="mapcol" id="mapcol" aria-label="The village map"></div>
      </section>
    </div>
  </main>

  <!-- overlays -->
  <div class="overlay" id="ov-start" hidden></div>
  <div class="overlay" id="ov-afternoon" hidden></div>
  <div class="overlay" id="ov-visit" hidden></div>
  <div class="overlay" id="ov-ledger" hidden></div>
  <div class="overlay" id="ov-evening" hidden></div>
  <div class="overlay" id="ov-steam" hidden></div>
  <div class="overlay" id="ov-hall" hidden></div>
  <div class="overlay" id="ov-panel" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="view.js"></script>
</body>

</html>
