<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Keelfall — a salvage-colony sim on the wreck of a colony ship. Cut a way down four terraces of a mountain, strip the ship you came in on for timber, scrap and wire, dam the runoff before it reaches the toxic basin, and put the beacon back on the peak." />
  <title>Keelfall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="map" aria-label="The mountainside. Choose a tool from the dock at the bottom, then click or drag on the map. Hold the button down near an edge to walk the camera."></canvas>

  <!-- ------------------------------------------------------------ top HUD -->
  <div class="hud hud-top">
    <div class="hud-group">
      <a class="plate btn back" href="../index.html" aria-label="Back to Amber's wall">&larr;</a>
      <span class="plate brand">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3 19h18" stroke="#6f8f86" stroke-width="1.6" fill="none" stroke-linecap="round" />
          <path d="M5 19l5-9 4 4 3-6 2 11z" fill="#8aa89c" />
          <path d="M13 4l5 3-2 4-5-3z" fill="#d9a04c" />
          <circle cx="17.5" cy="3.5" r="1.6" fill="#f0d08a" />
        </svg>
        <b>Keelfall</b>
      </span>
    </div>

    <div class="res" id="res" aria-label="What is on the command deck"></div>

    <div class="hud-group">
      <p class="plate clock" id="clock">Runoff 1</p>
      <button type="button" class="plate btn" id="ledger-btn" data-action="ledger" title="The log — everything the colony is doing (L)">
        <span class="bookmark" aria-hidden="true"></span><b>Log</b>
        <span class="badge" id="ledger-badge" hidden></span>
      </button>
      <div class="plate speed" role="group" aria-label="Game speed">
        <button type="button" data-speed="0" title="Pause (space)">&#10074;&#10074;</button>
        <button type="button" data-speed="1" class="on" title="Normal speed">&#9654;</button>
        <button type="button" data-speed="3" title="Fast">&#9654;&#9654;</button>
      </div>
      <div class="plate zoom" role="group" aria-label="Zoom">
        <button type="button" data-zoom="-1" title="Zoom out (-)">&#8722;</button>
        <button type="button" data-zoom="0" title="Whole mountain (0)">&#9681;</button>
        <button type="button" data-zoom="1" title="Zoom in (+)">+</button>
      </div>
      <button type="button" class="plate btn" data-action="levels" title="Show the level of every tile (E)">&#8801;</button>
      <button type="button" class="plate btn" data-action="help" title="How to play">?</button>
      <button type="button" class="plate btn" data-action="new-game" title="Come down somewhere else">&#10227;</button>
    </div>
  </div>

  <!-- ------------------------------------- everything that pops up, bottom left -->
  <div class="corner">
    <aside class="panel" id="panel" aria-label="Details" hidden></aside>
    <div class="notice-slot" id="notice-slot"></div>
    <p class="hint" id="hint"></p>
  </div>

  <!-- -------------------------------------------------------- bottom dock -->
  <div class="dock">
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Build tools"></div>
  </div>

  <div class="minimap">
    <canvas id="mini" aria-label="A small map of the whole mountain. Click to move the view."></canvas>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <script src="game.js"></script>
</body>

</html>
