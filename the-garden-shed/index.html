<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="The Garden Shed — grow flowers in a potting shed and sell them to people who want to say something with them." />
  <title>The Garden Shed</title>
  <link rel="icon" type="image/png" href="../images/duck.png" />
  <!-- Baloo 2, Caveat and Nunito are bundled in assets/fonts and declared in
       style.css, so the shed does not wait on fonts.googleapis.com to paint. -->
  <link rel="preload" href="assets/fonts/Nunito.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/Baloo2.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <header class="topbar">
      <a class="home" href="../index.html" title="Back to the wall">&larr;</a>
      <h1>The Garden Shed</h1>
      <div class="hud-plate date" id="hud-date"></div>
      <div class="hud-plate weather" id="hud-weather"></div>
      <div class="hud-plate actions" id="hud-actions" aria-live="polite"></div>
      <div class="spacer"></div>
      <button class="tiny pause-btn" id="btn-pause" title="Open or close the stall">Stall open</button>
      <button class="tiny" id="btn-shop" title="The seed catalogue"><span class="lg">Catalogue</span><span class="sm">🌱</span></button>
      <button class="tiny" id="btn-diary">Diary</button>
      <button class="tiny" id="btn-help" title="How to play"><span class="lg">How to play</span><span class="sm">?</span></button>
      <button class="tiny" id="btn-restart" title="Start over with a new shop"><span class="lg">Start over</span><span class="sm">↺</span></button>
    </header>

    <main class="stage" id="stage">

      <!-- the garden: where the flowers grow, out of the shed door -->
      <section class="view" id="view-garden">
        <div class="garden" id="garden-scene">
          <i class="g-sky" aria-hidden="true"></i>
          <i class="g-hills" aria-hidden="true"></i>
          <i class="g-hedge" aria-hidden="true"></i>
          <i class="g-fence" aria-hidden="true"></i>
          <i class="g-lawn" aria-hidden="true"></i>
          <i class="g-bed l" aria-hidden="true"></i><i class="g-bed r" aria-hidden="true"></i>
          <i class="g-path" aria-hidden="true"></i>
          <img class="g-d g-sign" src="assets/art/sign.png" alt="" />
          <img class="g-d g-stone" src="assets/art/stone-planter.png" alt="" />
          <img class="g-d g-fern" src="assets/art/fern.png" alt="" />
          <img class="g-d g-lettuce" src="assets/art/lettuce-pot.png" alt="" />
          <img class="g-d g-spade" src="assets/art/spade.png" alt="" />
          <img class="g-d g-basket" src="assets/art/basket.png" alt="" />
          <!-- two tiers of slatted staging, four pots to a tier: POT_MAX -->
          <div class="g-staging">
            <div class="pots" id="pots"></div>
          </div>
          <div class="g-front">
            <div class="packets" id="packets"></div>
            <button class="can" id="can" title="Watering can" aria-label="Watering can">
              <i class="handle"></i><i class="body"></i><i class="spout"></i><i class="rose"></i>
            </button>
          </div>
          <div class="glow" aria-hidden="true"></div>
        </div>
        <div class="scene-note">
          <p class="note" id="garden-note"></p>
        </div>
      </section>

      <!-- the shed: the view you are usually looking at -->
      <section class="view on" id="view-sill">
        <div class="shed" id="sill-scene">

          <!-- boards, a beam, and a post at either end -->
          <div class="wall" aria-hidden="true">
            <i class="rafter"></i><i class="post l"></i><i class="post r"></i>
            <i class="tool trowel"></i><i class="tool fork"></i>
          </div>
          <div class="floor" aria-hidden="true"><i class="skirt"></i><i class="spill"></i></div>

          <!-- On the painted plate (style.css, `gs-`): Amber's own props, set in the room.
               Scenery only — nothing here is clicked, and the phone layout hides it. -->
          <div class="gs-dress" aria-hidden="true">
            <i class="gs-garden"></i>
            <i class="gs-tint gs-tint-window"></i>
            <img class="gs-d gs-trowel" src="assets/art/trowel.png" alt="" />
            <img class="gs-d gs-fork" src="assets/art/hand-fork.png" alt="" />
            <img class="gs-d gs-shears" src="assets/art/shears.png" alt="" />
            <img class="gs-d gs-sign" src="assets/art/sign.png" alt="" />
            <img class="gs-d gs-spade" src="assets/art/spade.png" alt="" />
            <img class="gs-d gs-jars-r" src="assets/art/jars.png" alt="" />
            <img class="gs-d gs-cat" src="assets/art/cat.png" alt="" />
            <img class="gs-d gs-basket" src="assets/art/basket.png" alt="" />
            <img class="gs-d gs-basket-t" src="assets/art/basket-tomatoes.png" alt="" />
          </div>

          <!-- the door, stood open on the garden -->
          <div class="door">
            <div class="out" aria-hidden="true">
              <i class="sun" id="sky-sun"></i>
              <i class="cloud c1"></i><i class="cloud c2"></i>
              <i class="peaks far"></i><i class="peaks near"></i>
              <i class="hills far"></i><i class="hills near"></i>
              <i class="treeline"></i>
              <i class="field"></i>
              <i class="tree t1"></i><i class="tree t2"></i><i class="tree t3"></i>
              <i class="cot"></i>
              <i class="mill"><b class="tower"></b><b class="sails"></b></i>
              <i class="barn"></i>
              <i class="hay"></i>
              <i class="fence"></i>
              <i class="crops"></i>
              <i class="path"></i>
            </div>
            <div class="fx" aria-hidden="true"><i class="fx-a"></i><i class="fx-b"></i></div>
            <button class="door-hit" id="btn-door" title="Out to the garden">
              <span class="lb">the garden</span>
            </button>
            <i class="jamb" aria-hidden="true"></i>
            <i class="leaf" aria-hidden="true"></i>
          </div>

          <!-- the window over the far end of the table -->
          <div class="shed-window" aria-hidden="true"><i class="out"></i><i class="mull"></i></div>

          <!-- the vases on the left-hand shelf, and ribbon on reels on the shelf above -->
          <div class="vases" id="vases"></div>
          <div class="ribbons" id="ribbons"></div>

          <!-- the shelf over the table (the drawn shed's; the painted room has its own) -->
          <div class="shelf plants" aria-hidden="true">
            <i class="board"></i><i class="brace l"></i><i class="brace r"></i>
          </div>

          <!-- the table. The cut flowers stand on the right-hand shelves in the painted room
               (along the back of the table on a phone); the vase you are filling stands on the mat. -->
          <div class="bench" aria-hidden="true"><i class="top"></i><i class="leg"></i></div>
          <div class="counter" id="counter">
            <div class="tray">
              <div class="pantry" id="pantry"></div>
            </div>
          </div>
          <div class="bench-row">
            <button class="cookbook" id="btn-cook" title="The Language of Flowers">
              <i class="pages"></i><i class="cover"></i>
            </button>
            <div class="bench-mat empty" id="bench"></div>
          </div>

          <div class="motes" aria-hidden="true"></div>
          <div class="glow" aria-hidden="true"></div>
        </div>
        <div class="scene-note">
          <p class="note" id="sill-note"></p>
        </div>
      </section>

      <!-- the stall: the counter at the end of the lane, where people come and ask -->
      <section class="view" id="view-stall">
        <div class="stall" id="stall-scene">
          <i class="s-sky" aria-hidden="true"></i>
          <i class="s-hills" aria-hidden="true"></i>
          <i class="s-cottages" aria-hidden="true"><b></b><b></b><b></b></i>
          <i class="s-lane" aria-hidden="true"></i>
          <i class="s-hedge" aria-hidden="true"></i>
          <button class="s-customer" id="customer" title="Nobody here yet"></button>
          <i class="s-post l" aria-hidden="true"></i><i class="s-post r" aria-hidden="true"></i>
          <i class="s-awning" aria-hidden="true"></i>
          <i class="s-bunting" aria-hidden="true"></i>
          <button class="s-sign" id="door-sign" title="Turn the sign: open, or closed for a while">Open</button>
          <div class="s-board" id="price-board"></div>
          <div class="s-dialog hidden" id="dialog" aria-live="polite"></div>
          <div class="s-counter">
            <div class="s-buckets" id="stall-buckets"></div>
            <div class="s-made" id="stall-made"></div>
            <!-- stood on the counter while the stall is closed, so nobody can miss it -->
            <button class="s-closed hidden" id="stall-closed" title="Closed for now. Click to open again."><span class="sc-t">Sorry,</span><span class="sc-b">we're closed</span></button>
          </div>
          <div class="glow" aria-hidden="true"></div>
        </div>
        <div class="scene-note">
          <p class="note" id="stall-note"></p>
        </div>
      </section>

      <!-- the way between them: the garden, the shed, the stall, left to right -->
      <button class="nav-arrow left" id="nav-left" title="">
        <span class="na-ico" aria-hidden="true">&lsaquo;</span><span class="na-lb" id="nav-left-lb"></span><i class="na-badge" aria-hidden="true"></i>
      </button>
      <button class="nav-arrow right" id="nav-right" title="">
        <span class="na-ico" aria-hidden="true">&rsaquo;</span><span class="na-lb" id="nav-right-lb"></span><i class="na-badge" aria-hidden="true"></i><span class="na-who" id="nav-right-who" aria-live="polite"></span>
      </button>

      <div class="goals hidden" id="goals">
        <button class="goals-head" id="goals-toggle" title="Show all three">
          <span class="gh-t">Next:</span> <span class="gh-next" id="goals-next"></span> <span class="gh-n" id="goals-n"></span>
        </button>
        <ul>
          <li data-goal="cut"><span class="g-ico">✂️</span><span class="g-txt">Cut a pot in flower, out in the garden</span><span class="g-mark"></span></li>
          <li data-goal="display"><span class="g-ico">💐</span><span class="g-txt">Put an arrangement out on the stall</span><span class="g-mark"></span></li>
          <li data-goal="serve"><span class="g-ico">💐</span><span class="g-txt">Make somebody's flowers</span><span class="g-mark"></span></li>
        </ul>
        <p class="goals-hint">This clears off once you have done all three.</p>
        <button class="goals-x" id="goals-hide" title="Put the hints away">✕</button>
      </div>

    </main>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="log" id="log" aria-live="polite"></div>


  <script src="game.js"></script>
</body>

</html>
