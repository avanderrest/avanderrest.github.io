<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hollowmarch — raise a village at the crossroads, wall the roads and hold the keep against the horde." />
  <title>Hollowmarch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The world the keep stands in: sky, torchlight, drifting embers. Purely
       decorative — every playable thing lives in .stage on top of it. -->
  <div class="scene" aria-hidden="true">
    <div class="scene-moon"></div>
    <div class="scene-embers"></div>
    <div class="scene-embers scene-embers-2"></div>
  </div>

  <div class="stage">
    <header class="topbar">
      <a class="home" href="../index.html" title="Back to the wall">&larr;</a>
      <div class="brand">
        <h1>Hollowmarch</h1>
        <p class="sub">Raise the village. Wall the roads. Hold the keep.</p>
      </div>
      <div class="stats">
        <div class="stat stat-wave"><span class="label">Wave</span><span class="value" id="stat-wave">1</span></div>
        <div class="stat stat-gold"><span class="label">Gold</span><span class="value" id="stat-gold">0</span></div>
        <div class="stat stat-castle"><span class="label">Keep</span><span class="value" id="stat-castle"></span></div>
      </div>
      <div class="topbar-btns">
        <button class="btn btn-ghost tiny" id="btn-help">How to play</button>
        <button class="btn btn-ghost tiny" id="btn-new" title="Start again from wave 1">New keep</button>
      </div>
    </header>

    <aside class="panel rail rail-left" aria-label="Village chronicle">
      <h2>Village chronicle</h2>
      <div class="reviews" id="reviews"></div>
    </aside>

    <section class="arena" aria-label="The Crossroads">
      <div class="board-wrap">
        <div class="grid" id="grid"></div>
        <div class="fx" id="fx" aria-hidden="true"></div>
      </div>
    </section>

    <aside class="panel rail rail-right" aria-label="On the road">
      <h2>On the road <span class="muted" id="guest-count"></span></h2>
      <div class="guests" id="guests"></div>
      <p class="hint" id="night-hint"></p>
    </aside>

    <div class="statusline">
      <span class="capacity" id="capacity"></span>
      <span class="hint" id="cell-hint">&nbsp;</span>
    </div>

    <footer class="dock">
      <div class="palette" id="palette"></div>
      <div class="dock-go">
        <button class="btn btn-speed" id="btn-speed">Speed &times;1</button>
        <button class="btn btn-primary" id="btn-night">Sound the alarm</button>
      </div>
    </footer>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card" id="overlay-card"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
