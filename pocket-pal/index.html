<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Pocket Pal — raise a fluffy virtual pet: feed it, stroke it with a hand cursor, and teach it tricks with a drawn gesture and a spoken word that a speech model hears right in your browser." />
  <meta name="theme-color" content="#a9cba0" />
  <title>Pocket Pal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../lib/touch.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <a class="home" href="../index.html" title="Back to the wall">&larr;</a>
    <h1>Pocket Pal</h1>
    <span class="pp-namepill"><span id="pp-name">…</span> · <span id="pp-mood" data-mood="content">Content</span></span>
    <div class="spacer"></div>
    <button class="tiny" id="pp-sound" type="button">♪ Sound on</button>
    <button class="tiny" id="pp-howto" type="button"><span class="lg">How to play</span><span class="sm">?</span></button>
  </header>

  <main class="pp-main">
    <section class="pp-stage" aria-label="The room">
      <div class="pp-frame">
        <canvas id="pp-room" aria-label="Your pet's room. Press and rub over your pet to stroke it; draw a gesture anywhere else to show it a trick; tap the floor to call it over."></canvas>
        <p class="pp-toast" id="pp-toast" role="status" aria-live="polite"></p>
        <p class="pp-heard" id="pp-heard" aria-live="polite"></p>
        <div class="pp-gesture-flash" id="pp-gesture-flash" aria-hidden="true"></div>
      </div>
    </section>

    <section class="pp-panel pp-status" aria-label="Status and care">
      <h2>Status</h2>
      <div id="pp-stats" class="pp-stats"></div>
      <div class="pp-friend">
        <div class="pp-hearts" id="pp-hearts"></div>
        <div class="pp-age" id="pp-age"></div>
      </div>
      <h2>Care</h2>
      <div class="pp-care">
        <button class="pp-btn care" id="pp-feed" type="button" aria-expanded="false"><span class="ic">🥣</span> Feed</button>
        <button class="pp-btn care" id="pp-play" type="button"><span class="ic">⚽</span> Play</button>
        <button class="pp-btn care" id="pp-wash" type="button"><span class="ic">🛁</span> Bath</button>
        <button class="pp-btn care" id="pp-sleep" type="button"><span class="ic">🌙</span> Sleep</button>
      </div>
      <div class="pp-foods" id="pp-foods" hidden>
        <button type="button" data-food="kibble"><span>🥣</span>Kibble</button>
        <button type="button" data-food="apple"><span>🍎</span>Apple</button>
        <button type="button" data-food="cake"><span>🧁</span>Cupcake</button>
      </div>
    </section>

    <section class="pp-panel pp-tricks" aria-label="Tricks">
      <h2>Tricks</h2>
      <ul class="pp-trick-list" id="pp-trick-list"></ul>
      <div class="pp-train" id="pp-train">
        <h3 id="pp-train-title">Teach Sit</h3>
        <div class="pp-step" id="pp-step1">
          <div class="pp-step-h"><b>Step 1</b> Gesture</div>
          <svg class="pp-demo" viewBox="0 0 100 70" aria-hidden="true">
            <defs><marker id="pp-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0703a" /></marker></defs>
            <path id="pp-ghost" d="M50 10 L50 60" pathLength="100" marker-end="url(#pp-arrow)" />
          </svg>
          <p class="pp-hint" id="pp-gesture-hint">Swipe down across the room</p>
        </div>
        <div class="pp-step" id="pp-step2">
          <div class="pp-step-h"><b>Step 2</b> Say <span class="pp-word" id="pp-word">sit</span> <button type="button" class="pp-link" id="pp-edit-word" title="Choose your own word">✎</button></div>
          <div class="pp-voice-row">
            <button type="button" class="pp-mic" id="pp-mic" title="Tap and speak (or hold Space)" aria-label="Listen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg></button>
            <canvas class="pp-meter" id="pp-meter" width="168" height="44" aria-hidden="true"></canvas>
          </div>
          <button type="button" class="pp-say" id="pp-say">Say “<b>sit</b>”</button>
          <p class="pp-hint small">No mic? Tap the word to say it.</p>
        </div>
        <div class="pp-progress">
          <div class="pp-pips" id="pp-pips"></div>
          <p id="pp-progress-text">0 of 3 good tries</p>
        </div>
        <p class="pp-actions">
          <button type="button" class="pp-btn primary" id="pp-train-start">Start lesson</button>
          <button type="button" class="pp-btn" id="pp-train-stop" hidden>Stop lesson</button>
        </p>
      </div>
      <details class="pp-voice">
        <summary>Ears: <span id="pp-voice-status">The mic loads Whisper the first time.</span></summary>
        <label class="pp-field">Listen with <select id="pp-engine"></select></label>
        <p class="pp-hint small" id="pp-engine-note"></p>
      </details>
    </section>
  </main>

  <div class="pp-dialog" id="pp-dialog" hidden>
    <div class="pp-card" id="pp-dialog-body" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="view.js"></script>
</body>

</html>
