<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Image Filter Studio</title>
  <link rel="stylesheet" href="css/styles.css?v=19">
</head>
<body>
  <header>
    <a class="back-link" href="../index.html">&larr; Back</a>
  </header>

  <main>
    <section id="dropzone">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <p class="drop-title">Drop an image and pick a style</p>
      <div class="dz-box">
        <p class="drop-hint">Drag &amp; drop an image here, paste from clipboard (Ctrl+V),</p>
        <div class="drop-actions">
          <button id="browseBtn" class="btn accent">Browse files</button>
          <button id="demoBtn" class="btn">Try a demo image</button>
        </div>
      </div>
    </section>

    <section id="studio" hidden>
      <div id="controls">
        <label for="strength"><span id="strengthLabel">Blend</span>
          <input type="range" id="strength" min="0" max="100" value="100">
          <span id="strengthVal">100%</span>
        </label>
        <button id="downloadBtn" class="btn accent">Download PNG</button>
        <button id="resetBtn" class="btn">New image</button>
      </div>

      <div id="workspace">
        <div id="previewCol">
          <div id="compare">
        <figure>
          <canvas id="originalCanvas"></canvas>
          <figcaption>Original</figcaption>
        </figure>
        <figure class="result-pane">
          <canvas id="resultCanvas"></canvas>
          <div id="resultBusy" hidden><div class="mini-spinner"></div><span>Processing…</span></div>
          <figcaption>Filtered</figcaption>
        </figure>
          </div>
        </div>

        <div id="sideCol">
          <section id="layersPanel">
            <div class="layers-head">
              <p class="layers-title" id="layersTitle">Layer stack</p>
              <button id="addLayerBtn" class="btn accent">+ Add style</button>
            </div>
            <div id="layerList"></div>
          </section>

          <h2>Styles</h2>
          <div id="filterGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>Runs 100% locally in your browser — no uploads, no servers.</footer>

  <script src="js/filters.js?v=21"></script>
  <script src="js/demo-image.js?v=1"></script>
  <script src="js/app.js?v=28"></script>
</body>
</html>
