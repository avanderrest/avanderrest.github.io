<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9B%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="Image Studio — drop in a photo and stack styles on it: ink sketch, neon edges, halftone, oil painting and more, then download the PNG." />
  <title>Image Studio</title>
  <link rel="stylesheet" href="css/styles.css?v=23">
</head>
<body>
  <main>
    <section id="studio">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div id="controls">
        <a class="btn back-btn" href="../index.html">&larr; Back</a>
        <button id="downloadBtn" class="btn accent">Download PNG</button>
        <button id="resetBtn" class="btn">New image</button>
      </div>

      <div id="workspace">
        <div id="previewCol">
          <div id="compare">
        <figure class="pane">
          <canvas id="originalCanvas"></canvas>
          <figcaption>Original</figcaption>
        </figure>
        <figure class="pane result-pane" data-region="both" data-label="Filtered">
          <canvas id="resultCanvas"></canvas>
          <div id="resultBusy" hidden><div class="mini-spinner"></div><span>Processing…</span></div>
          <figcaption>Filtered</figcaption>
        </figure>
        <figure class="pane" data-region="fg" data-label="Foreground">
          <canvas id="fgCanvas"></canvas>
          <figcaption>Foreground</figcaption>
        </figure>
        <figure class="pane" data-region="bg" data-label="Background">
          <canvas id="bgCanvas"></canvas>
          <figcaption>Background</figcaption>
        </figure>
          </div>
        </div>

        <div id="sideCol">
          <section id="layersPanel">
            <div class="layers-head">
              <p class="layers-title" id="layersTitle">Layer stack</p>
              <button id="addLayerBtn" class="btn accent">+ Add style</button>
            </div>
            <div id="bgSliderGroup">
            <div class="param-row bg-tol-row">
              <span class="param-label">Background tolerance</span>
              <input type="range" id="bgTol" min="0" max="95" value="46">
              <span class="param-val" id="bgTolVal">46</span>
            </div>
            <div class="param-row bg-tol-row">
              <span class="param-label">Background soften</span>
              <input type="range" id="bgSoften" min="0" max="30" value="0">
              <span class="param-val" id="bgSoftenVal">0</span>
            </div>
            </div>
            <div id="layerList"></div>
          </section>

          <h2>Styles</h2>
          <div id="filterGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/filters.js?v=30"></script>
  <script src="js/background.js?v=2"></script>
  <script src="js/demo-image.js?v=1"></script>
  <script src="js/app.js?v=45"></script>
</body>
</html>
