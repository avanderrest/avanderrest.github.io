<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cottage Diary — a tiny turn-based life sim. One cottage, one garden, six neighbours, three things a day." />
  <title>Cottage Diary</title>
  <link rel="icon" type="image/png" href="../images/duck.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <a class="home" href="../index.html" title="Back to the wall">&larr;</a>
    <h1>Cottage Diary</h1>
    <div class="date" id="hud-date"></div>
    <div class="weather" id="hud-weather"></div>
    <div class="actions" id="hud-actions" aria-live="polite"></div>
    <button class="bed-btn" id="btn-sleep">Go to bed</button>
  </header>

  <main class="layout">
    <section class="col col-garden">
      <div class="panel" id="garden-panel">
        <div class="panel-head">
          <h2>The garden</h2>
          <span class="sub" id="garden-sub"></span>
        </div>
        <div class="beds" id="beds"></div>
        <p class="note" id="garden-note"></p>
      </div>

      <div class="panel" id="cottage-panel">
        <div class="panel-head">
          <h2>The cottage</h2>
        </div>
        <div class="fence">
          <div class="fence-row">
            <span class="label">Fence</span>
            <div class="meter"><div class="meter-fill" id="fence-fill"></div></div>
            <span class="val" id="fence-val"></span>
          </div>
          <button class="act" id="btn-mend"></button>
        </div>
        <div class="shelf">
          <div class="shelf-head">
            <span class="label">Shelf</span>
            <button class="act" id="btn-cook">Cook something</button>
          </div>
          <div class="dishes" id="dishes"></div>
        </div>
        <div class="pantry">
          <span class="label">Pantry</span>
          <div class="chips" id="pantry"></div>
        </div>
      </div>
    </section>

    <section class="col col-village">
      <div class="panel" id="village-panel">
        <div class="panel-head">
          <h2>The village</h2>
          <span class="sub">Six neighbours down the lane</span>
        </div>
        <div class="folk" id="folk"></div>
      </div>
    </section>

    <section class="col col-diary">
      <div class="panel diary" id="diary-panel">
        <div class="panel-head">
          <h2>Diary</h2>
          <button class="tiny" id="btn-help">How to play</button>
        </div>
        <div class="entries" id="diary"></div>
      </div>
    </section>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="game.js"></script>
</body>

</html>
