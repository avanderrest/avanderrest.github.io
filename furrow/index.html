<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Furrow — a small farming-village sim. Lay out fields and paths on an empty plot, fill a yard with hens, pigs, cows and sheep, and decide what the storehouse sells and what the bakery, dairy and weaver's keep." />
  <title>Furrow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <a class="back" href="../index.html" aria-label="Back to Amber's wall">&larr;</a>
      <span class="crest" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M12 22V9" stroke="#8a6a3a" stroke-width="1.6" fill="none" stroke-linecap="round" />
          <g fill="#e0a458">
            <ellipse cx="12" cy="5" rx="2" ry="3.4" />
            <ellipse cx="7.6" cy="8.4" rx="1.8" ry="3.1" transform="rotate(-28 7.6 8.4)" />
            <ellipse cx="16.4" cy="8.4" rx="1.8" ry="3.1" transform="rotate(28 16.4 8.4)" />
            <ellipse cx="8.4" cy="13.4" rx="1.6" ry="2.8" transform="rotate(-28 8.4 13.4)" />
            <ellipse cx="15.6" cy="13.4" rx="1.6" ry="2.8" transform="rotate(28 15.6 13.4)" />
          </g>
        </svg>
      </span>
      <h1>Furrow</h1>
    </div>
    <p class="clock" id="clock">Spring 1</p>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="topbar-actions">
      <div class="speed" role="group" aria-label="Game speed">
        <button type="button" data-speed="0" title="Pause">&#10074;&#10074;</button>
        <button type="button" data-speed="1" class="on" title="Normal speed">&#9654;</button>
        <button type="button" data-speed="3" title="Fast">&#9654;&#9654;</button>
      </div>
      <button class="ghost" data-action="help" type="button">How to play</button>
      <button class="ghost" data-action="new-game" type="button">New plot</button>
    </div>
  </header>

  <main class="layout">
    <section class="field" aria-label="The plot">
      <div class="canvas-wrap">
        <canvas id="map" width="832" height="544" aria-label="The plot. Choose a tool below, then click or drag on the map. Hold the button down near an edge to walk the camera."></canvas>
      </div>
      <p class="hint" id="hint"></p>
      <div class="tools-wrap">
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Build tools"></div>
        <div class="minimap">
          <canvas id="mini" aria-label="A small map of the whole plot. Click to move the view."></canvas>
          <span class="mini-label">the whole plot</span>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Details"></aside>
  </main>

  <div class="overlay" id="overlay" hidden></div>

  <script src="game.js"></script>
</body>

</html>
