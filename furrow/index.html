<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Furrow — a small farming-village sim. Lay out fields and paths on an empty plot, fill a yard with hens, pigs, cows and sheep, and decide what the storehouse sells and what the bakery, dairy and weaver's keep." />
  <title>Furrow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="map" aria-label="The plot. Choose a tool from the dock at the bottom, then click or drag on the map. Hold the button down near an edge to walk the camera."></canvas>

  <!-- ------------------------------------------------------------ top HUD -->
  <div class="hud hud-top">
    <div class="hud-group">
      <a class="plate btn back" href="../index.html" aria-label="Back to Amber's wall">&larr;</a>
      <span class="plate brand">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 22V9" stroke="#8a6a3a" stroke-width="1.6" fill="none" stroke-linecap="round" />
          <g fill="#e0a458">
            <ellipse cx="12" cy="5" rx="2" ry="3.4" />
            <ellipse cx="7.6" cy="8.4" rx="1.8" ry="3.1" transform="rotate(-28 7.6 8.4)" />
            <ellipse cx="16.4" cy="8.4" rx="1.8" ry="3.1" transform="rotate(28 16.4 8.4)" />
            <ellipse cx="8.4" cy="13.4" rx="1.6" ry="2.8" transform="rotate(-28 8.4 13.4)" />
            <ellipse cx="15.6" cy="13.4" rx="1.6" ry="2.8" transform="rotate(28 15.6 13.4)" />
          </g>
        </svg>
        <b>Furrow</b>
      </span>
    </div>

    <p class="plate clock" id="clock">Spring 1</p>

    <div class="hud-group">
      <button type="button" class="plate btn purse" id="purse" data-action="ledger" title="The ledger — everything the plot is doing (L)">
        <span class="coin" aria-hidden="true"></span><b id="purse-n">0</b><span class="purse-lbl">coins</span>
        <span class="badge" id="purse-badge" hidden></span>
      </button>
      <div class="plate speed" role="group" aria-label="Game speed">
        <button type="button" data-speed="0" title="Pause (space)">&#10074;&#10074;</button>
        <button type="button" data-speed="1" class="on" title="Normal speed">&#9654;</button>
        <button type="button" data-speed="3" title="Fast">&#9654;&#9654;</button>
      </div>
      <div class="plate zoom" role="group" aria-label="Zoom">
        <button type="button" data-zoom="-1" title="Zoom out (-)">&#8722;</button>
        <button type="button" data-zoom="0" title="Default view (0)" class="zoom-fit">&#9681;</button>
        <button type="button" data-zoom="1" title="Zoom in (+)">+</button>
      </div>
      <button type="button" class="plate btn" data-action="help" title="How to play">?</button>
      <button type="button" class="plate btn" data-action="new-game" title="New plot">&#10227;</button>
    </div>
  </div>

  <!-- ------------------------------------- everything that pops up, bottom left -->
  <div class="corner">
    <!-- the details of whatever is selected -->
    <aside class="panel" id="panel" aria-label="Details" hidden></aside>

    <!-- this morning's notice, when there is one -->
    <div class="notice-slot" id="notice-slot"></div>

    <!-- and the line of advice for the tool in hand -->
    <p class="hint" id="hint"></p>
  </div>

  <!-- -------------------------------------------------------- bottom dock -->
  <div class="dock">
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Build tools"></div>
  </div>

  <div class="minimap">
    <canvas id="mini" aria-label="A small map of the whole plot. Click to move the view."></canvas>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <script src="game.js"></script>
</body>

</html>
