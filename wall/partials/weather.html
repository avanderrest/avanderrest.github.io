<article class="tile tile-widget tile-weather t-wx" id="weather-widget" aria-label="Weather and what to wear">
  <form class="wx-loc" id="wx-form" autocomplete="off">
    <input type="text" id="wx-place" placeholder="Place" aria-label="Change place" />
    <button type="submit" aria-label="Look up place">Go</button>
    <button type="button" id="wx-locate" aria-label="Use my location" title="Use my location">&#9678;</button>
  </form>
  <div class="wx-nav">
    <button type="button" class="wx-arrow" id="wx-prev" aria-label="Previous day" disabled>&lsaquo;</button>
    <p class="wx-date" id="wx-date">&nbsp;</p>
    <button type="button" class="wx-arrow" id="wx-next" aria-label="Next day" disabled>&rsaquo;</button>
  </div>
  <div class="wx-scene" id="wx-scene" role="img" aria-label="A girl out in the park, dressed for the weather">
    <div class="wx-bg" id="wx-bg"></div>
    <div class="wx-girl" id="wx-girl"></div>
    <canvas id="wx-canvas" aria-hidden="true"></canvas>
  </div>
  <div class="wx-days" id="wx-days" aria-live="polite">
    <p class="wx-status" id="wx-status">Checking the sky&hellip;</p>
  </div>
</article>
